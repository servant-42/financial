<!doctype html>
<html>
<head>
  <title>Financial Tracking &amp; Reports</title>
  <link href="vendor/bootstrap-5.3.8.css" rel="stylesheet">
  <style>
    body { margin: 1em }
    table { border-collapse: collapse}
    th {
      background-color: #eee;
      /* Is this already handled by Bootstrap, or do we still need to do this? */
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    /*
      this can't be done with inline CSS; we can define a data-style-hover attribute (or just style-hover?)
      this could be implemented via manual onMouseOver or via generating a unique classname -- maybe that'd be better for the other inline styles too?
    */
    #filedrag.hover {
      color: #2672EC;
      border-color: #2672EC;
      border-style: solid;
      box-shadow: inset 0 3px 4px #888;
    }
    col.action-btn { width: 200px }
    @media print {
      #filedrag { display: none }
      .btn { display: none }
      td.action-btn { display: none }
      col.action-btn { width: 100% !important }
    }

    td { width: 85px }
    table td,th { border: 1px solid #ccc; padding: 5px}
    td.invalid { color: white; background-color: #990000; font-weight: bold}
    a.month { color: var(--bs-body-color) }
    .amt { text-align: right }
    th.category { text-align: left; margin-left: 1em; white-space: nowrap}
    th.sidebar { text-align: left }
    th.separator { height: 8px }
    .split { cursor: pointer; display: none }
    .split.is-split { display: inline }
    td:hover .split { display: inline }
    svg.bi {
      vertical-align: -0.125em; /* Adjust as needed */
    }
  </style>
  <script src="vendor/underscore.js"></script>
  <script src="vendor/sax.js"></script>
  <script src="vendor/popper.min.js"></script>
  <script src="vendor/bootstrap-5.3.8.js"></script>
</head>
<body>
  <script src="app.js"></script>
  <script src="year-view.js"></script>
  <script src="split-modal.js"></script>
  <script src="month-view.js"></script>
  <script>
    window.app = new App(localStorage, location, document, bootstrap.Modal);
    app.navigate();
    document.body.appendChild(app.el);
    window.addEventListener('hashchange', app.onHashChange.bind(app));
    
    // special export handling code
    document.addEventListener('keydown', (evt) => {
      // do CSV export
      if (evt.ctrlKey && evt.key == 'e') {
        evt.preventDefault(); // Prevent the browser's default action (if any)

        let month = new Date().getMonth() + 1;
        let month_str = pad2(month);
        let jan_trns = filterRecords(app.transactions, {month: `2026-${month_str}`, category_id: 2});

        // TODO: add in pending transactions & the few relevant checking transactions

        let days = [];
        for (let day = 1; day <= 31; day++) {
          let iso_date = `2026-${month_str}-${pad2(day)}`;
          let trns = jan_trns.filter(trn => trn.date == iso_date);
          let total = -sumAmounts(trns);
          days.push({date: `${month_str}/${pad2(day)}/2026`, pending_amt: displayCents(0), total: displayCents(total)});
        }
        
        let csv = toCSV(days);
        let month_name = [null, 'jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'][month];
        downloadCSV(csv, `${month_name}-2026.csv`);
      }   
    });

    function toCSV(arr) {
      let headers = Object.keys(arr[0]);
      arr = [headers].concat(arr);

      return arr.map(item => {
        return Object.values(item).map(value => {
          // escape values containing commas or double quotes
          if (typeof value == 'string' && (value.includes(',') || value.includes('"')))
            return `"${value.replace(/"/g, '""')}"`;
          
          return value;
        }).join(',');
      }).join('\n');
    }

    function downloadCSV(csv_str, filename) {
      // Create a Blob object with the CSV data and type
      const blob = new Blob([csv_str], { type: 'text/csv;charset=utf-8;' });
      
      // Create a temporary link element
      const link = document.createElement('a');

      // Create a URL for the Blob object
      const url = URL.createObjectURL(blob);
      link.href = url;
      
      // Set the download attribute with the desired filename
      link.setAttribute('download', filename);
      
      // Append link to body, click it, and remove it
      document.body.appendChild(link); // Required for Firefox
      link.click();
      document.body.removeChild(link);
      
      // Free up the object URL after a short delay
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  </script>
</body>
</html>
