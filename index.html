<!doctype html>
<html>
<head>
  <title>Financial Tracking &amp; Reports</title>
  <link href="vendor/bootstrap-5.3.8.css" rel="stylesheet">
  <style>
    body { margin: 1em }
    table { border-collapse: collapse}
    th {
      background-color: #eee;
      /* Is this already handled by Bootstrap, or do we still need to do this? */
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    /*
      this can't be done with inline CSS; we can define a data-style-hover attribute (or just style-hover?)
      this could be implemented via manual onMouseOver or via generating a unique classname -- maybe that'd be better for the other inline styles too?
    */
    #filedrag.hover {
      color: #2672EC;
      border-color: #2672EC;
      border-style: solid;
      box-shadow: inset 0 3px 4px #888;
    }
    col.action-btn { width: 200px }
    @media print {
      #filedrag { display: none }
      .btn { display: none }
      td.action-btn { display: none }
      col.action-btn { width: 100% !important }
    }

    td { width: 85px }
    table td,th { border: 1px solid #ccc; padding: 5px}
    td.invalid { color: white; background-color: #990000; font-weight: bold}
    a.month { color: var(--bs-body-color) }
    .amt { text-align: right }
    th.category { text-align: left; margin-left: 1em; white-space: nowrap}
    th.sidebar { text-align: left }
    th.separator { height: 8px }
    .split { cursor: pointer; display: none }
    .split.is-split { display: inline }
    td:hover .split { display: inline }
    svg.bi {
      vertical-align: -0.125em; /* Adjust as needed */
    }
  </style>
  <script src="vendor/underscore.js"></script>
  <script src="vendor/sax.js"></script>
  <script src="vendor/popper.min.js"></script>
  <script src="vendor/bootstrap-5.3.8.js"></script>
</head>
<body>
  <script src="app.js"></script>
  <script src="year-view.js"></script>
  <script src="split-modal.js"></script>
  <script src="month-view.js"></script>
  <script>
    window.app = new App(localStorage, location, document, bootstrap.Modal);
    app.navigate();
    document.body.appendChild(app.el);
    window.addEventListener('hashchange', app.onHashChange.bind(app));
  </script>
</body>
</html>
